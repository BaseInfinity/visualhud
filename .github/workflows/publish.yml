name: Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag containing the retained tarball
        required: true
        type: string
      candidate_sha256:
        description: Accepted SHA-256 of the retained tarball
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download and verify retained candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "candidate_sha256 must contain exactly 64 hexadecimal characters." >&2
            exit 1
          fi
          case "${EXPECTED_SHA256,,}" in
            01b039ca675e9d1cf58135d70ced18a853eafda521b9c3cbb230779a6043fb5f|\
            691dab58a180b0e52b96566b3f1463f7d7678a92340b99e71e14ce8bed95ad18|\
            fa3c6c20270ad32880347082d4abe242e306e96605c7a94c09798aff7eede4f1|\
            319cc1472d8e7bd35d140b8b31038d05460eb8876c7079b5739dd4f4284ea174)
              echo "Candidate SHA-256 is quarantined and must not be published: ${EXPECTED_SHA256,,}." >&2
              exit 1
              ;;
          esac

          download_dir="$RUNNER_TEMP/visualhud-release"
          mkdir -p "$download_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'visualhud-*.tgz' \
            --dir "$download_dir"

          shopt -s nullglob
          candidates=("$download_dir"/visualhud-*.tgz)
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "Expected exactly one visualhud-*.tgz release asset; found ${#candidates[@]}." >&2
            exit 1
          fi
          candidate="${candidates[0]}"
          actual_sha256="$(shasum -a 256 "$candidate" | awk '{print $1}')"
          if [ "$actual_sha256" != "${EXPECTED_SHA256,,}" ]; then
            echo "Candidate SHA-256 mismatch: expected ${EXPECTED_SHA256,,}, got $actual_sha256." >&2
            exit 1
          fi

          manifest="$(tar -xOf "$candidate" package/package.json)"
          package_name="$(jq -er '.name | select(type == "string" and length > 0)' <<<"$manifest")"
          package_version="$(jq -er '.version | select(type == "string" and length > 0)' <<<"$manifest")"
          if [ "$package_name" != "visualhud" ] || [ "v$package_version" != "$RELEASE_TAG" ]; then
            echo "Candidate identity $package_name@$package_version does not match visualhud@$RELEASE_TAG." >&2
            exit 1
          fi

          echo "path=$candidate" >> "$GITHUB_OUTPUT"
          echo "Verified $package_name@$package_version ($actual_sha256)."

      - name: Dry-run retained candidate
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
        run: |
          candidate="$CANDIDATE"
          npm publish "$candidate" --access public --ignore-scripts --dry-run

      - name: Publish retained candidate
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
        run: |
          candidate="$CANDIDATE"
          npm publish "$candidate" --access public --ignore-scripts
